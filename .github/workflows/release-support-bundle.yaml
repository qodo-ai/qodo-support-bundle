name: Release support bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the binaries
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/qodo-support-bundle/go.mod
          cache: false

      - name: Test
        working-directory: tools/qodo-support-bundle
        run: make test

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        working-directory: tools/qodo-support-bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make release VERSION="$VERSION"

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qodo-support-bundle-${{ env.RELEASE_TAG }}
          path: tools/qodo-support-bundle/dist/
          if-no-files-found: error

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" tools/qodo-support-bundle/dist/* --clobber
