name: Release support bundle

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; dispatch this workflow from the same tag ref
        required: true
        type: string

permissions: {}

jobs:
  native-smoke:
    name: Native CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Unix installer
        if: ${{ runner.os != 'Windows' }}
        run: sh tests/install_sh_test.sh

      - name: Test Windows installer
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          Invoke-ScriptAnalyzer -Path ./install.ps1 -EnableExit
          Invoke-Pester -Path ./tests/Install.Tests.ps1 -CI

      - name: Exercise native Windows ARM64 release and installer
        if: ${{ matrix.os == 'windows-11-arm' }}
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'qodo-scout-arm64-release'
          $install = Join-Path $env:RUNNER_TEMP 'qodo-scout-arm64-install'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $asset = Join-Path $release 'qodo-support-bundle-windows-arm64.exe'
          go build -trimpath -o $asset ./cmd/qodo-support-bundle
          & $asset version
          if ($LASTEXITCODE -ne 0) { throw 'native ARM64 release smoke check failed' }
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -LiteralPath (Join-Path $release 'checksums.sha256') `
            -Value "$digest  qodo-support-bundle-windows-arm64.exe" `
            -NoNewline
          ./install.ps1 `
            -Version 0.0.0-ci `
            -SourceDir $release `
            -InstallDir $install
          & (Join-Path $install 'qodo-scout.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'installed ARM64 release smoke check failed' }

      - name: Run native CLI bundle smoke test
        run: go test ./internal/e2e -count=1 -v

  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Install Python test dependencies
        run: make test-python-deps

      - name: Test
        run: make test

      - name: Validate release build
        run: |
          set -euo pipefail
          make release VERSION=0.0.0-ci
          cd dist
          sha256sum --check checksums.sha256
          test -f qodo-support-bundle-linux-amd64
          test -f qodo-support-bundle-linux-arm64
          test -f qodo-support-bundle-darwin-amd64
          test -f qodo-support-bundle-darwin-arm64
          test -f qodo-support-bundle-windows-amd64.exe
          test -f qodo-support-bundle-windows-arm64.exe

  release:
    if: ${{ github.event_name != 'pull_request' }}
    needs: native-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-requirements.txt

      - name: Validate release source
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_TAG_NAME="$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)"
          if [[ "$RELEASE_TAG_NAME" != "$RELEASE_TAG" ]]; then
            echo "GitHub release tag mismatch: expected $RELEASE_TAG, got $RELEASE_TAG_NAME" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "Checked-out HEAD $HEAD_SHA does not match $RELEASE_TAG at $TAG_SHA" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.sha }}" != "$TAG_SHA" ]]; then
            echo "Workflow revision ${{ github.sha }} does not match $RELEASE_TAG at $TAG_SHA." >&2
            echo "For workflow_dispatch, run this workflow with --ref $RELEASE_TAG." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Python test dependencies
        run: make test-python-deps

      - name: Test
        run: make test

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: make release VERSION="$VERSION"

      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Store workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qodo-support-bundle-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
