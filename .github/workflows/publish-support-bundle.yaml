name: Publish support bundle to dev bucket

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact GitHub release version to publish
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: support-bundle-dev-publication
  cancel-in-progress: false

env:
  QODO_SUPPORT_BUNDLE_BUCKET: qodo-cli-public-dev
  QODO_SUPPORT_BUNDLE_PREFIX: support-bundle
  GCP_PROJECT_NUMBER: "430654255805"
  GCP_SERVICE_ACCOUNT: qodo-support-bundle-publisher@codium-development.iam.gserviceaccount.com

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout publication logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Download and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $VERSION" >&2
            exit 1
          fi
          mkdir dist
          gh release download "v${VERSION}" --dir dist
          gh attestation verify dist/* --repo "$GITHUB_REPOSITORY"
          (cd dist && sha256sum --check checksums.sha256)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Publish immutable dev canary
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ inputs.version }}
        run: ./scripts/publish-gcs.sh
