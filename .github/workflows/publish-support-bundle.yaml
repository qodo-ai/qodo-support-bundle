name: Publish support bundle to dev bucket

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact GitHub release version to publish
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: support-bundle-dev-publication
  cancel-in-progress: false

env:
  QODO_SUPPORT_BUNDLE_BUCKET: qodo-cli-public-dev
  QODO_SUPPORT_BUNDLE_PREFIX: support-bundle
  GCP_PROJECT_NUMBER: "430654255805"
  GCP_SERVICE_ACCOUNT: qodo-support-bundle-publisher@codium-development.iam.gserviceaccount.com

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout publication logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Resolve GitHub release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RELEASE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          candidates=("$REQUESTED_RELEASE")
          if [[ "$REQUESTED_RELEASE" != v* ]]; then
            candidates+=("v${REQUESTED_RELEASE}")
          fi
          release_tag=
          for candidate in "${candidates[@]}"; do
            if gh release view "$candidate" --json tagName >/dev/null 2>&1; then
              release_tag="$candidate"
              break
            fi
          done
          if [[ -z "$release_tag" ]]; then
            echo "GitHub release not found: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)"
          {
            echo "tag=${release_tag}"
            echo "version=${release_tag#v}"
            echo "sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-support-bundle.yaml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG"
          done
          (cd dist && sha256sum --strict --check checksums.sha256)
          (cd dist && sha256sum --strict --check installer-checksums.sha256)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Publish immutable dev canary
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/publish-gcs.sh

      - name: Exercise pinned and metadata-selected dev installers
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: sh scripts/canary-dev-installers.sh

  windows-arm64-canary:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout canary logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Exercise native Windows ARM64 dev installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'qodo-scout-dev-arm64'
          $release = Join-Path $work 'release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          gcloud storage cp "gs://$env:QODO_SUPPORT_BUNDLE_BUCKET/$env:QODO_SUPPORT_BUNDLE_PREFIX/version.json" "$work/version.json"
          $env:QODO_SCOUT_INSTALLER_TESTING = '1'
          . ./install.ps1
          $resolved = ConvertFrom-QodoScoutVersionJson (Get-Content "$work/version.json" -Raw)
          if ($resolved -ne $env:EXPECTED_VERSION.TrimStart('v')) {
              throw "dev metadata selected $resolved, expected $env:EXPECTED_VERSION"
          }
          foreach ($name in @(
              'install.ps1',
              'checksums.sha256',
              'qodo-support-bundle-windows-arm64.exe'
          )) {
              gcloud storage cp "gs://$env:QODO_SUPPORT_BUNDLE_BUCKET/$env:QODO_SUPPORT_BUNDLE_PREFIX/releases/$resolved/$name" "$release/$name"
          }
          gcloud storage cp "gs://$env:QODO_SUPPORT_BUNDLE_BUCKET/$env:QODO_SUPPORT_BUNDLE_PREFIX/install.ps1" "$work/install.ps1"
          if ((Get-FileHash "$work/install.ps1").Hash -ne (Get-FileHash "$release/install.ps1").Hash) {
              throw 'stable and versioned Windows installers differ'
          }
          Remove-Item Env:QODO_SCOUT_INSTALLER_TESTING
          & "$work/install.ps1" -Version $resolved -SourceDir $release -InstallDir "$work/install"
          & "$work/install/qodo-scout.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'native Windows ARM64 canary failed' }
