name: Publish support bundle to dev bucket

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact GitHub release version to publish
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: support-bundle-dev-publication
  cancel-in-progress: false

env:
  QODO_SUPPORT_BUNDLE_BUCKET: qodo-cli-public-dev
  QODO_SUPPORT_BUNDLE_PREFIX: support-bundle
  GCP_PROJECT_NUMBER: "430654255805"
  GCP_SERVICE_ACCOUNT: qodo-support-bundle-publisher@codium-development.iam.gserviceaccount.com

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout publication logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Resolve GitHub release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RELEASE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release version: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          candidates=("$REQUESTED_RELEASE")
          if [[ "$REQUESTED_RELEASE" != v* ]]; then
            candidates+=("v${REQUESTED_RELEASE}")
          fi
          release_tag=
          for candidate in "${candidates[@]}"; do
            if gh release view "$candidate" --json tagName >/dev/null 2>&1; then
              release_tag="$candidate"
              break
            fi
          done
          if [[ -z "$release_tag" ]]; then
            echo "GitHub release not found: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)"
          {
            echo "tag=${release_tag}"
            echo "version=${release_tag#v}"
            echo "sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-support-bundle.yaml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG"
          done
          (cd dist && sha256sum --strict --check checksums.sha256)
          (cd dist && sha256sum --strict --check installer-checksums.sha256)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Publish immutable dev canary
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/publish-gcs.sh

      - name: Exercise pinned dev installer
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: sh scripts/canary-dev-installers.sh

  windows-arm64-canary:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout canary logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Exercise native Windows ARM64 dev installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'qodo-scout-dev-arm64'
          $version = $env:EXPECTED_VERSION.TrimStart('v')
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          gcloud storage cp "gs://$env:QODO_SUPPORT_BUNDLE_BUCKET/$env:QODO_SUPPORT_BUNDLE_PREFIX/releases/$version/install.ps1" "$work/install.ps1"

          function global:curl.exe {
              param(
                  [Parameter(ValueFromRemainingArguments = $true)]
                  [string[]]$CurlArguments
              )
              $destination = $null
              $url = $null
              for ($index = 0; $index -lt $CurlArguments.Count; $index++) {
                  if ($CurlArguments[$index] -eq '--output') {
                      $destination = $CurlArguments[++$index]
                  } elseif ($CurlArguments[$index] -like 'https://get.qodo.ai/support-bundle/*') {
                      $url = $CurlArguments[$index]
                  }
              }
              if (-not $destination -or -not $url) {
                  throw 'dev canary curl received an unexpected request'
              }
              $relative = $url.Substring('https://get.qodo.ai/support-bundle/'.Length)
              $allowed = @(
                  "releases/$version/checksums.sha256",
                  "releases/$version/qodo-support-bundle-windows-arm64.exe"
              )
              if ($relative -notin $allowed) {
                  throw "dev canary curl received an unexpected object: $relative"
              }
              gcloud storage cp "gs://$env:QODO_SUPPORT_BUNDLE_BUCKET/$env:QODO_SUPPORT_BUNDLE_PREFIX/$relative" $destination
              if ($LASTEXITCODE -ne 0) {
                  throw "failed to download dev object: $relative"
              }
          }

          & "$work/install.ps1" -Version $version -InstallDir "$work/pinned"
          $pinnedVersion = (& "$work/pinned/qodo-scout.exe" version).Trim()
          if ($LASTEXITCODE -ne 0 -or $pinnedVersion -ne $version) {
              throw "pinned native Windows ARM64 binary reports '$pinnedVersion', expected '$version'"
          }
