name: Promote support bundle to production bucket

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact dev-canary version to promote
        required: true
        type: string

permissions:
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: support-bundle-production-promotion
  cancel-in-progress: false

env:
  QODO_SUPPORT_BUNDLE_SOURCE_BUCKET: qodo-cli-public-dev
  QODO_SUPPORT_BUNDLE_DESTINATION_BUCKET: qodo-cli-public
  QODO_SUPPORT_BUNDLE_PREFIX: support-bundle
  GCP_PROJECT_NUMBER: "67590289846"
  GCP_SERVICE_ACCOUNT: qodo-support-bundle-publisher@codium-production.iam.gserviceaccount.com

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout promotion logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Resolve GitHub release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RELEASE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          candidates=("$REQUESTED_RELEASE")
          if [[ "$REQUESTED_RELEASE" != v* ]]; then
            candidates+=("v${REQUESTED_RELEASE}")
          fi
          release_tag=
          for candidate in "${candidates[@]}"; do
            if gh release view "$candidate" --json tagName >/dev/null 2>&1; then
              release_tag="$candidate"
              break
            fi
          done
          if [[ -z "$release_tag" ]]; then
            echo "GitHub release not found: $REQUESTED_RELEASE" >&2
            exit 1
          fi
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)"
          {
            echo "tag=${release_tag}"
            echo "version=${release_tag#v}"
            echo "sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify GitHub release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$RELEASE_TAG" --dir release
          for asset in release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-support-bundle.yaml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG"
          done
          (cd release && sha256sum --strict --check checksums.sha256)
          (cd release && sha256sum --strict --check installer-checksums.sha256)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Promote byte-identical release
        env:
          QODO_SUPPORT_BUNDLE_RELEASE_DIR: ${{ github.workspace }}/release
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/promote-gcs.sh

      - name: Verify public CDN bytes and headers
        env:
          QODO_SUPPORT_BUNDLE_RELEASE_DIR: ${{ github.workspace }}/release
          QODO_SUPPORT_BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: sh scripts/verify-production-cdn.sh

  production-unix-canary:
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout canary logic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Exercise pinned and metadata-selected production installers
        env:
          QODO_SUPPORT_BUNDLE_VERSION: ${{ needs.promote.outputs.version }}
        run: sh scripts/canary-production-installers.sh

  production-windows-arm64-canary:
    needs: promote
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Exercise pinned and metadata-selected production installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          $base = 'https://get.qodo.ai/support-bundle'
          $work = Join-Path $env:RUNNER_TEMP 'qodo-scout-production-arm64'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          curl.exe --fail --location --silent --show-error --output "$work/install.ps1" "$base/install.ps1"
          curl.exe --fail --location --silent --show-error --output "$work/version.json" "$base/version.json"
          $metadata = Get-Content "$work/version.json" -Raw | ConvertFrom-Json
          if (
              @($metadata.PSObject.Properties).Count -ne 1 -or
              $metadata.version -ne $env:EXPECTED_VERSION
          ) {
              throw 'production version.json does not match the promoted version'
          }
          curl.exe --fail --location --silent --show-error --output "$work/versioned-install.ps1" "$base/releases/$env:EXPECTED_VERSION/install.ps1"
          if ((Get-FileHash "$work/install.ps1").Hash -ne (Get-FileHash "$work/versioned-install.ps1").Hash) {
              throw 'stable and versioned Windows installers differ'
          }
          & "$work/install.ps1" -InstallDir "$work/metadata"
          $metadataVersion = (& "$work/metadata/qodo-scout.exe" version).Trim()
          if ($LASTEXITCODE -ne 0 -or $metadataVersion -ne $env:EXPECTED_VERSION) {
              throw "metadata-selected Windows ARM64 binary reports '$metadataVersion', expected '$env:EXPECTED_VERSION'"
          }
          & "$work/install.ps1" -Version $env:EXPECTED_VERSION -InstallDir "$work/pinned"
          $pinnedVersion = (& "$work/pinned/qodo-scout.exe" version).Trim()
          if ($LASTEXITCODE -ne 0 -or $pinnedVersion -ne $env:EXPECTED_VERSION) {
              throw "pinned Windows ARM64 binary reports '$pinnedVersion', expected '$env:EXPECTED_VERSION'"
          }
